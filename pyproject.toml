[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI assistant — Phase 1-2 (text + voice MVP, memory)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "dateparser>=1.2",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "win11toast>=0.35; sys_platform == 'win32'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
