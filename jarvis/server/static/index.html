<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a1a2e">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #333; display: flex;
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; margin: 0; }
  #enableNotifications {
    background: none; border: 1px solid #5ac8fa; color: #5ac8fa;
    border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer;
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 80%; margin-bottom: 10px; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { background: #5ac8fa; color: #111; margin-left: auto; }
  .msg.assistant { background: #2a2a45; margin-right: auto; }
  .msg.system { background: transparent; color: #999; font-size: 0.85rem; text-align: center; max-width: 100%; }
  form#composer {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid #333; flex-shrink: 0;
  }
  #input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
    background: #12121e; color: #eee; font-size: 1rem;
  }
  button.send {
    padding: 10px 16px; border-radius: 8px; border: none; background: #5ac8fa;
    color: #111; font-weight: 600; cursor: pointer;
  }
  button.confirm {
    margin-top: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid #ff6b6b;
    background: none; color: #ff6b6b; cursor: pointer;
  }
  #setup {
    position: fixed; inset: 0; background: #1a1a2e; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
  }
  #setup[hidden] { display: none; }
  #setup input { width: 100%; max-width: 320px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #12121e; color: #eee; }
  #setup button { padding: 10px 20px; border-radius: 8px; border: none; background: #5ac8fa; color: #111; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div id="setup" hidden>
  <h2>Connect to JARVIS</h2>
  <p>Paste the API token from your server's <code>.env</code> (API_AUTH_TOKEN).</p>
  <input id="tokenInput" type="password" placeholder="Bearer token" autocomplete="off">
  <button id="saveToken">Save</button>
</div>

<header>
  <h1>JARVIS</h1>
  <button id="enableNotifications">Enable notifications</button>
</header>

<div id="messages"></div>

<form id="composer">
  <input id="input" type="text" placeholder="Message JARVIS..." autocomplete="off">
  <button class="send" type="submit">Send</button>
</form>

<script>
const TOKEN_KEY = "jarvis_token";

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function ensureToken() {
  if (getToken()) return;
  document.getElementById("setup").hidden = false;
}

document.getElementById("saveToken").addEventListener("click", () => {
  const value = document.getElementById("tokenInput").value.trim();
  if (!value) return;
  localStorage.setItem(TOKEN_KEY, value);
  document.getElementById("setup").hidden = true;
});

const messagesEl = document.getElementById("messages");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function apiGet(path) {
  const res = await fetch(path, {
    method: "GET",
    headers: { "Authorization": "Bearer " + getToken() },
  });
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    ensureToken();
    throw new Error("Unauthorized — re-enter your token.");
  }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken(),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    ensureToken();
    throw new Error("Unauthorized — re-enter your token.");
  }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

async function sendMessage(text) {
  addMessage("user", text);
  try {
    const data = await apiPost("/chat", { message: text });
    const el = addMessage("assistant", data.reply);
    if (data.needs_confirmation) {
      const btn = document.createElement("button");
      btn.className = "confirm";
      btn.textContent = "Confirm: forget everything";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        const confirmData = await apiPost("/forget-everything/confirm");
        addMessage("system", confirmData.reply);
      });
      el.after(btn);
    }
  } catch (err) {
    addMessage("system", err.message);
  }
}

document.getElementById("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((char) => char.charCodeAt(0)));
}

document.getElementById("enableNotifications").addEventListener("click", async () => {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      addMessage("system", "Notification permission was not granted.");
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    const { public_key } = await apiGet("/vapid-public-key");
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(public_key),
    });
    await apiPost("/push/subscribe", { subscription: subscription.toJSON() });
    addMessage("system", "Notifications enabled on this device.");
  } catch (err) {
    addMessage("system", "Couldn't enable notifications: " + err.message);
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

ensureToken();
</script>
</body>
</html>
