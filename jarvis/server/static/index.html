<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#04070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --cyan: #4dd9ff;
    --cyan-bright: #eafcff;
    --cyan-dim: #6fa8bf;
    --cyan-faint: #0d3a45;
    --bg: #04070c;
    --panel: rgba(15, 35, 45, 0.45);
    --red: #ff5450;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, sans-serif; color: var(--cyan-bright);
    background: radial-gradient(ellipse at top, rgba(20, 70, 90, 0.35), transparent 60%), var(--bg);
    position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(77, 217, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 217, 255, 0.05) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  .hud-font { font-family: 'Orbitron', system-ui, sans-serif; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--cyan-faint); display: flex;
    justify-content: space-between; align-items: center; flex-shrink: 0;
    position: relative; z-index: 1; background: rgba(4, 10, 14, 0.6); backdrop-filter: blur(4px);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  .arc-reactor {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at center, var(--cyan-bright) 0%, var(--cyan) 40%, var(--cyan-faint) 75%, transparent 100%);
    box-shadow: 0 0 8px 2px var(--cyan), 0 0 16px 4px rgba(77, 217, 255, 0.4);
    animation: pulse-glow 2.4s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 8px 2px var(--cyan), 0 0 14px 3px rgba(77, 217, 255, 0.35); }
    50% { box-shadow: 0 0 12px 4px var(--cyan), 0 0 22px 7px rgba(77, 217, 255, 0.55); }
  }
  header h1 {
    font-size: 1.05rem; margin: 0; letter-spacing: 0.12em; font-weight: 700;
    text-shadow: 0 0 8px rgba(77, 217, 255, 0.6);
  }
  header .controls { display: flex; gap: 8px; align-items: center; }
  #speakToggle {
    font-family: 'Orbitron', system-ui, sans-serif;
    background: rgba(77, 217, 255, 0.08); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 6px 12px; font-size: 0.72rem; cursor: pointer; letter-spacing: 0.05em;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  #speakToggle.on { background: var(--cyan); color: #04070c; box-shadow: 0 0 10px rgba(77, 217, 255, 0.6); }
  #messages { flex: 1; overflow-y: auto; padding: 16px; position: relative; z-index: 1; }
  .msg {
    max-width: 80%; margin-bottom: 6px; padding: 10px 14px; white-space: pre-wrap;
    font-size: 0.95rem; line-height: 1.45; border: 1px solid;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .msg.user {
    background: linear-gradient(135deg, rgba(77, 217, 255, 0.20), rgba(77, 217, 255, 0.06));
    border-color: var(--cyan); color: var(--cyan-bright); margin-left: auto;
    box-shadow: 0 0 10px rgba(77, 217, 255, 0.2);
  }
  .msg.assistant {
    background: linear-gradient(135deg, rgba(110, 170, 210, 0.12), rgba(20, 40, 55, 0.5));
    border-color: #2d5b6e; color: var(--cyan-bright); margin-right: auto;
    box-shadow: 0 0 8px rgba(60, 140, 170, 0.12);
  }
  .msg.system {
    background: none; border: none; color: var(--cyan-dim); font-family: 'Courier New', monospace;
    font-size: 0.78rem; text-align: center; max-width: 100%; clip-path: none; margin: 8px 0;
  }
  .thinking { display: flex; gap: 6px; padding: 4px 14px 10px; align-items: center; position: relative; z-index: 1; }
  .thinking[hidden] { display: none; }
  .thinking .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.15); }
  }
  button.replay {
    margin: 2px 0 8px; padding: 2px 10px; border: 1px solid #2d5b6e;
    background: none; color: var(--cyan-dim); cursor: pointer; font-size: 0.75rem;
  }
  button.confirm {
    margin: 2px 0 8px; padding: 6px 14px; border: 1px solid var(--red);
    background: none; color: var(--red); cursor: pointer; font-family: 'Orbitron', system-ui, sans-serif;
    font-size: 0.75rem; letter-spacing: 0.04em;
  }
  form#composer {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--cyan-faint); flex-shrink: 0;
    position: relative; z-index: 1; background: rgba(4, 10, 14, 0.6);
  }
  #input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--cyan-faint);
    background: rgba(8, 18, 24, 0.8); color: var(--cyan-bright); font-size: 1rem;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  #input:focus { outline: none; border-color: var(--cyan); }
  button.send {
    font-family: 'Orbitron', system-ui, sans-serif; letter-spacing: 0.05em;
    padding: 10px 18px; border: 1px solid var(--cyan); background: var(--cyan);
    color: #04070c; font-weight: 700; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  button.mic {
    width: 46px; flex-shrink: 0; padding: 10px; border: 1px solid var(--cyan-faint);
    background: rgba(8, 18, 24, 0.8); color: var(--cyan-bright); font-size: 1.1rem; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  button.mic.listening {
    background: rgba(255, 84, 80, 0.15); border-color: var(--red); color: var(--red);
    animation: mic-pulse 1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 4px var(--red); }
    50% { box-shadow: 0 0 16px 4px var(--red); }
  }
  #setup {
    position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 2;
  }
  #setup[hidden] { display: none; }
  #setup h2 { font-family: 'Orbitron', system-ui, sans-serif; letter-spacing: 0.08em; text-shadow: 0 0 10px rgba(77, 217, 255, 0.5); }
  #setup p { color: var(--cyan-dim); max-width: 320px; }
  #setup input {
    width: 100%; max-width: 320px; padding: 10px; border: 1px solid var(--cyan-faint);
    background: rgba(8, 18, 24, 0.8); color: var(--cyan-bright);
  }
  #setup input:focus { outline: none; border-color: var(--cyan); }
  #setup button {
    font-family: 'Orbitron', system-ui, sans-serif; letter-spacing: 0.05em;
    padding: 10px 24px; border: 1px solid var(--cyan); background: var(--cyan);
    color: #04070c; font-weight: 700; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  @media (prefers-reduced-motion: reduce) {
    .arc-reactor, .thinking .dot, button.mic.listening { animation: none !important; }
  }
</style>
</head>
<body>

<div id="setup" hidden>
  <div class="arc-reactor" style="width:48px;height:48px;"></div>
  <h2>CONNECT TO JARVIS</h2>
  <p>Paste the API token from your server's <code>.env</code> (API_AUTH_TOKEN).</p>
  <input id="tokenInput" type="password" placeholder="Bearer token" autocomplete="off">
  <button id="saveToken">Save</button>
</div>

<header>
  <div class="brand">
    <div class="arc-reactor"></div>
    <h1 class="hud-font">J.A.R.V.I.S.</h1>
  </div>
  <div class="controls">
    <button id="speakToggle" hidden>Speak: Off</button>
  </div>
</header>

<div id="messages"></div>

<div class="thinking" id="thinking" hidden>
  <span class="dot"></span><span class="dot"></span><span class="dot"></span>
</div>

<form id="composer">
  <button class="mic" id="micButton" type="button" hidden>🎤</button>
  <input id="input" type="text" placeholder="Message JARVIS..." autocomplete="off">
  <button class="send" type="submit">Send</button>
</form>

<script>
const TOKEN_KEY = "jarvis_token";
const SPEAK_KEY = "jarvis_speak_replies";

function getToken() { return localStorage.getItem(TOKEN_KEY); }

function ensureToken() {
  if (getToken()) return;
  document.getElementById("setup").hidden = false;
}

document.getElementById("saveToken").addEventListener("click", () => {
  unlockSpeechSynthesis();
  const value = document.getElementById("tokenInput").value.trim();
  if (!value) return;
  localStorage.setItem(TOKEN_KEY, value);
  document.getElementById("setup").hidden = true;
  trySetupNotifications();
});

const messagesEl = document.getElementById("messages");
const thinkingEl = document.getElementById("thinking");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);

  if (role === "assistant" && window.speechSynthesis) {
    const replay = document.createElement("button");
    replay.className = "replay";
    replay.textContent = "🔊 replay";
    replay.addEventListener("click", () => speakText(text));
    div.after(replay);
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function speakText(text) {
  if (!window.speechSynthesis || !text.trim()) return;
  window.speechSynthesis.cancel(); // don't stack overlapping utterances
  const utterance = new SpeechSynthesisUtterance(text);
  const voice = getJarvisVoice();
  if (voice) utterance.voice = voice;
  utterance.rate = 0.92; // slightly slower, calmer
  utterance.pitch = 0.88; // slightly deeper, more measured
  window.speechSynthesis.speak(utterance);
}

// Picks the most fitting British-accented male voice already installed on
// this device (never clones or reproduces any specific performance — only
// chooses among voices the OS/browser already legitimately ships). Scored,
// not hardcoded to one name, since available voices vary by device.
let cachedJarvisVoice = null;

function pickJarvisVoice() {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;

  const maleHints = ["male", "ryan", "daniel", "james", "arthur", "george", "thomas", "david", "oliver", "brian"];
  const femaleHints = ["female", "hazel", "susan", "libby", "sonia", "mia", "olivia", "emma", "amy"];

  let best = null;
  let bestScore = -Infinity;
  for (const voice of voices) {
    const lang = voice.lang.toLowerCase();
    const name = voice.name.toLowerCase();
    let score = 0;
    if (lang.startsWith("en-gb")) score += 10;
    else if (lang.startsWith("en")) score += 2;
    if (maleHints.some((hint) => name.includes(hint))) score += 5;
    if (femaleHints.some((hint) => name.includes(hint))) score -= 8;
    if (score > bestScore) {
      bestScore = score;
      best = voice;
    }
  }
  return best;
}

function getJarvisVoice() {
  return cachedJarvisVoice;
}

if (window.speechSynthesis) {
  cachedJarvisVoice = pickJarvisVoice();
  // Voice lists often load asynchronously after page load — re-pick once
  // the browser actually has them.
  window.speechSynthesis.addEventListener("voiceschanged", () => {
    cachedJarvisVoice = pickJarvisVoice();
  });
}

// Some mobile Chrome builds silently drop speak() calls that don't happen
// synchronously inside a user-gesture handler — our auto-speak call in
// sendMessage() fires after an `await` on the network reply, which no
// longer counts. The fix: speak one silent, empty utterance directly
// inside a real gesture (composer submit, mic button, speak toggle) once
// per page load — that "unlocks" the engine, and every later async-
// triggered speak() call in the same session then plays normally.
let speechUnlocked = false;
function unlockSpeechSynthesis() {
  if (speechUnlocked || !window.speechSynthesis) return;
  speechUnlocked = true;
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
}

async function apiGet(path) {
  const res = await fetch(path, {
    method: "GET",
    headers: { "Authorization": "Bearer " + getToken() },
  });
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    ensureToken();
    throw new Error("Unauthorized — re-enter your token.");
  }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken(),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    ensureToken();
    throw new Error("Unauthorized — re-enter your token.");
  }
  if (!res.ok) throw new Error("Request failed: " + res.status);
  return res.json();
}

async function sendMessage(text) {
  addMessage("user", text);
  thinkingEl.hidden = false;
  try {
    const data = await apiPost("/chat", { message: text });
    thinkingEl.hidden = true;
    const el = addMessage("assistant", data.reply);
    if (isSpeakEnabled()) {
      speakText(data.reply);
    }
    if (data.needs_confirmation) {
      const btn = document.createElement("button");
      btn.className = "confirm";
      btn.textContent = "Confirm: forget everything";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        const confirmData = await apiPost("/forget-everything/confirm");
        addMessage("system", confirmData.reply);
      });
      el.after(btn);
    }
  } catch (err) {
    thinkingEl.hidden = true;
    addMessage("system", err.message);
  }
}

document.getElementById("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  unlockSpeechSynthesis();
  trySetupNotifications();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

// -- Voice output: "speak replies" toggle (Web Speech API SpeechSynthesis) --
// Default: on — until explicitly toggled off, absence of a stored value
// means "speak."

const speakToggleBtn = document.getElementById("speakToggle");

function isSpeakEnabled() {
  const stored = localStorage.getItem(SPEAK_KEY);
  return stored === null ? true : stored === "on";
}

function setSpeakToggleUI(on) {
  speakToggleBtn.textContent = on ? "🔊 SPEAK: ON" : "🔊 SPEAK: OFF";
  speakToggleBtn.classList.toggle("on", on);
}

if (window.speechSynthesis) {
  speakToggleBtn.hidden = false;
  setSpeakToggleUI(isSpeakEnabled());
  speakToggleBtn.addEventListener("click", () => {
    unlockSpeechSynthesis();
    const nowOn = !isSpeakEnabled();
    localStorage.setItem(SPEAK_KEY, nowOn ? "on" : "off");
    setSpeakToggleUI(nowOn);
  });
}

// -- Voice input: mic button (Web Speech API SpeechRecognition) -------------

const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
const micButton = document.getElementById("micButton");

if (SpeechRecognitionImpl) {
  micButton.hidden = false;
  const recognition = new SpeechRecognitionImpl();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = true;

  let listening = false;

  recognition.addEventListener("result", (event) => {
    const transcript = Array.from(event.results).map((r) => r[0].transcript).join("");
    document.getElementById("input").value = transcript;
    if (event.results[event.results.length - 1].isFinal) {
      recognition.stop();
    }
  });

  recognition.addEventListener("end", () => {
    listening = false;
    micButton.classList.remove("listening");
    const input = document.getElementById("input");
    const text = input.value.trim();
    if (text) {
      input.value = "";
      sendMessage(text);
    }
  });

  recognition.addEventListener("error", (event) => {
    listening = false;
    micButton.classList.remove("listening");
    if (event.error !== "no-speech" && event.error !== "aborted") {
      addMessage("system", "Voice input error: " + event.error);
    }
  });

  micButton.addEventListener("click", () => {
    unlockSpeechSynthesis();
    trySetupNotifications();
    if (listening) {
      recognition.stop();
      return;
    }
    listening = true;
    micButton.classList.add("listening");
    recognition.start();
  });
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((char) => char.charCodeAt(0)));
}

// Notifications can't be turned on without a browser permission prompt —
// no site can silently grant itself that (a deliberate anti-spam
// restriction, not something to route around). Instead of a dedicated
// button, this rides along on the first genuine user gesture available
// (saving the token on first-time setup, or the first send/mic tap on a
// later visit where a token's already saved and that screen never shows),
// and only runs once per page load. Already-subscribed devices and a
// previous explicit denial are both handled quietly — no repeated nagging.
let notificationsAttempted = false;

async function trySetupNotifications() {
  if (notificationsAttempted) return;
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) return;
  notificationsAttempted = true;

  try {
    const registration = await navigator.serviceWorker.ready;
    const existing = await registration.pushManager.getSubscription();
    if (existing) return; // already enabled on this device

    if (Notification.permission === "denied") {
      addMessage(
        "system",
        "Notifications are blocked for this site — enable them in your browser's site settings if you'd like reminders and briefs pushed here."
      );
      return;
    }

    const permission = await Notification.requestPermission();
    if (permission !== "granted") return; // declined just now — stay quiet, don't nag

    const { public_key } = await apiGet("/vapid-public-key");
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(public_key),
    });
    await apiPost("/push/subscribe", { subscription: subscription.toJSON() });
    addMessage("system", "Notifications enabled on this device.");
  } catch (err) {
    addMessage("system", "Couldn't enable notifications: " + err.message);
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}

ensureToken();
</script>
</body>
</html>
